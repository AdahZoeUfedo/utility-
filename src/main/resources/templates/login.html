<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Utility International</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Utility International</h1>
        <h2>Customer Login</h2>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="username" placeholder="Enter your email" required/>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" placeholder="Enter your password" required/>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>

        <p style="margin-top: 20px;">Don't have an account? <a th:href="@{/register}">Register here</a></p>
    </div>
</div>
<div class="footer">© 2026 Utility International. All rights reserved.</div>
</body>
</html>
