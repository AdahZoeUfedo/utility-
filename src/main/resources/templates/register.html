<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Utility International</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Utility International</h1>
        <h2>Create an Account</h2>

        <form th:action="@{/register}" th:object="${customer}" method="post">
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" th:field="*{name}" placeholder="Enter your full name" required/>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" placeholder="Enter your email" required/>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" th:field="*{password}" placeholder="Create a password" required/>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>

        <p style="margin-top: 20px;">Already have an account? <a th:href="@{/login}">Login here</a></p>
    </div>
</div>
<div class="footer">© 2026 Utility International. All rights reserved.</div>
</body>
</html>
