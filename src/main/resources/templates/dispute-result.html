<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dispute Result - Utility International</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="navbar">
    <a class="logo" th:href="@{/dashboard}">Utility International</a>
    <nav>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/logout}">Logout</a>
    </nav>
</div>

<div class="container">
    <div class="card">
        <h1>Dispute Result</h1>

        <div class="alert alert-success" th:if="${message == 'Dispute submitted successfully'}">
            <span th:text="${message}"></span>
        </div>
        <div class="alert alert-error" th:if="${message != 'Dispute submitted successfully'}">
            <span th:text="${message}"></span>
        </div>

        <br/>
        <a th:href="@{/dashboard}" class="btn">Back to Dashboard</a>
    </div>
</div>
<div class="footer">© 2026 Utility International. All rights reserved.</div>
</body>
</html>
