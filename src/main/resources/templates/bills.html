<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Bills - Utility International</title>
</head>
<body>
<h1>My Bills</h1>

<a th:href="@{/dashboard}">Back to Dashboard</a>

<table border="1">
    <thead>
    <tr>
        <th>Bill ID</th>
        <th>Amount</th>
        <th>Due Date</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="bill : ${bills}">
        <td th:text="${bill.id}"></td>
        <td th:text="${bill.amount}"></td>
        <td th:text="${bill.dueDate}"></td>
        <td th:text="${bill.status}"></td>
        <td>
            <a th:href="@{/bills/pay/__${bill.id}__}">Pay</a> |
            <a th:href="@{/disputes/new/__${bill.id}__}">Dispute</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
